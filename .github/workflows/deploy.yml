name: Build Custom Cap Docker Image

on:
  workflow_dispatch:

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    name: Build & Artifact Docker Image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom Cap Docker image (AVX2-free)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cap-server:custom

      - name: Export Docker image to tarball
        run: |
          docker save cap-server:custom -o cap-server-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cap-server-custom-image
          path: cap-server-image.tar
          retention-days: 7
